[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "voices-az"
dynamic = ["version"]
description = "Official Python client for the Voices.az API: text-to-speech, speech-to-text and video dubbing."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Learning Machine", email = "salam@learningmachine.az" }]
keywords = [
    "voices.az",
    "azerbaijani",
    "text-to-speech",
    "tts",
    "speech-to-text",
    "stt",
    "transcription",
    "dubbing",
    "api-client",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.24,<1"]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4",
    "respx>=0.20",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://voices.az"
Documentation = "https://voices.az/docs"
Repository = "https://github.com/Voices-az/voices-python"
Issues = "https://github.com/Voices-az/voices-python/issues"

[tool.hatch.version]
path = "src/voices_az/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/voices_az"]

[tool.hatch.build.targets.sdist]
include = [
    "src/voices_az",
    "tests",
    "examples",
    "docs",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.coverage.run]
source = ["voices_az"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

[tool.mypy]
strict = true
files = ["src/voices_az"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "UP006",  # keep typing.List etc. readable on 3.9
    "UP007",  # Optional[X] instead of X | None for 3.9
    "UP035",
    "UP045",
    "RUF022", # __all__ is grouped by topic, not sorted
    "RUF001", # Azerbaijani letters (ı, ə, ...) are not typos
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
